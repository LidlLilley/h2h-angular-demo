<div style="max-width: 900px; margin: 40px auto; padding: 24px; font-family: system-ui, sans-serif; background: #0f172a; color: #ffffff; border-radius: 16px;">
  
  <header style="text-align: center; margin-bottom: 30px;">
    <h1 style="color: #ffffff; margin: 0 0 8px 0;">H2H MATCHUP ENGINE</h1>
    <p style="color: #94a3b8; margin: 0;">Live Premier League Data via C# .NET API</p>
  </header>

  <div *ngIf="loading" style="text-align: center; padding: 40px; font-weight: bold;">
    Loading Live Premier League Stats...
  </div>

  <div *ngIf="!loading">
    
    <!-- Team Selectors -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
      
      <!-- Home Dropdown -->
      <div style="background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155;">
        <label style="color: #ffffff; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; display: block; margin-bottom: 8px;">
          Select Home Team
        </label>
        <select (change)="onHomeSelect($event)" style="width: 100%; padding: 10px 12px; background: #0f172a; color: #ffffff; border: 1px solid #334155; border-radius: 8px; font-weight: bold; font-size: 1rem;">
          <option value="" disabled [selected]="!homeTeam">-- Choose Home Team --</option>
          <option *ngFor="let team of teams" [value]="team.id" [disabled]="team.id === awayTeam?.id">
            {{ team.name }}
          </option>
        </select>
      </div>

      <!-- Away Dropdown -->
      <div style="background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155;">
        <label style="color: #ffffff; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; display: block; margin-bottom: 8px;">
          Select Away Team
        </label>
        <select (change)="onAwaySelect($event)" style="width: 100%; padding: 10px 12px; background: #0f172a; color: #ffffff; border: 1px solid #334155; border-radius: 8px; font-weight: bold; font-size: 1rem;">
          <option value="" disabled [selected]="!awayTeam">-- Choose Away Team --</option>
          <option *ngFor="let team of teams" [value]="team.id" [disabled]="team.id === homeTeam?.id">
            {{ team.name }}
          </option>
        </select>
      </div>

    </div>

    <!-- Lottie Motion Graphic Player Container -->
    <div *ngIf="homeTeam && awayTeam" style="display: flex; justify-content: center; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155;">
      <div style="width: 540px; height: 540px; max-width: 100%; position: relative;">
        <div #templateContainer style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></div>
      </div>
    </div>

  </div>
</div>
